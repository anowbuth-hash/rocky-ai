
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131c">
<meta name="description" content="Rocky AI — Your assistant for ideas, learning and getting things done.">
<title>Rocky AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10131c;
  color: #f5f6fa;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}

.logo {
  background: #7567f8;
  border-radius: 14px;
  padding: 12px;
  font-size: 22px;
  font-weight: bold;
}

h1 {
  font-size: 22px;
  margin: 0;
}

.status {
  color: #9ba3b7;
  font-size: 12px;
  margin-top: 5px;
}

.header-actions {
  margin-left: auto;
}

.new-chat {
  background: #252b3c;
  border: 1px solid #424a61;
  padding: 10px 13px;
}

main {
  flex: 1;
  padding: 25px 0;
}

.welcome {
  text-align: center;
  margin: 35px 0;
}

.welcome h2 {
  font-size: 30px;
}

.welcome p {
  color: #aab1c2;
  line-height: 1.6;
}

.availability {
  background: #252b3c;
  border: 1px solid #424a61;
  border-radius: 12px;
  padding: 14px;
  margin: 20px 0;
  text-align: center;
  color: #d8dced;
  font-size: 14px;
  line-height: 1.5;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 25px 0;
}

.card {
  background: #1b2030;
  border: 1px solid #30374a;
  border-radius: 13px;
  padding: 17px;
  color: white;
  text-align: left;
  cursor: pointer;
}

.card:hover:not(:disabled) {
  border-color: #7567f8;
}

.card strong {
  display: block;
  margin-bottom: 7px;
}

.card span {
  color: #aab1c2;
  font-size: 13px;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  padding: 13px 16px;
  border-radius: 15px;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6659df;
  align-self: flex-end;
}

.bot {
  background: #202638;
  align-self: flex-start;
}

.message.loading {
  opacity: 0.75;
  font-style: italic;
}

form {
  display: flex;
  gap: 10px;
  background: #1b2030;
  border: 1px solid #343b50;
  border-radius: 16px;
  padding: 9px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: white;
  font-size: 16px;
  padding: 8px;
}

input::placeholder {
  color: #929bb0;
}

button {
  border: 0;
  background: #7567f8;
  color: white;
  border-radius: 11px;
  padding: 12px 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled,
input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #aaa1ff;
  outline-offset: 3px;
}

footer {
  text-align: center;
  color: #788197;
  font-size: 11px;
  padding: 16px;
}

@media(max-width: 420px) {
  .app {
    padding: 14px;
  }

  .welcome h2 {
    font-size: 25px;
  }

  .cards {
    gap: 8px;
  }

  .card {
    padding: 12px;
  }

  .header-actions button {
    padding: 9px;
    font-size: 12px;
  }

  form {
    gap: 6px;
  }

  form button {
    padding: 11px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo" aria-hidden="true">R</div>

  <div>
    <h1>Rocky AI</h1>
    <div class="status" id="status" aria-live="polite">
      Checking availability...
    </div>
  </div>

  <div class="header-actions">
    <button class="new-chat" id="newChat" type="button">
      + New Chat
    </button>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <h2>Hello! I'm Rocky.</h2>
    <p>Your AI assistant for ideas, learning and getting things done.</p>
  </section>

  <div
    class="availability"
    id="availability"
    role="status"
    aria-live="polite"
  >
    Checking Rocky AI availability...
  </div>

  <div class="cards" id="cards">
    <button class="card" type="button" onclick="suggest('Help me plan my day')" disabled>
      <strong>📅 Plan my day</strong>
      <span>Organise tasks and goals</span>
    </button>

    <button class="card" type="button" onclick="suggest('Help me explore a business idea')" disabled>
      <strong>💡 Explore ideas</strong>
      <span>Discover new possibilities</span>
    </button>

    <button class="card" type="button" onclick="suggest('Teach me something interesting')" disabled>
      <strong>📚 Learn something</strong>
      <span>Understand new topics</span>
    </button>

    <button class="card" type="button" onclick="suggest('Help me write something')" disabled>
      <strong>✍️ Write something</strong>
      <span>Make writing easier</span>
    </button>
  </div>

  <div id="chat" aria-live="polite"></div>
</main>

<form id="form">
  <input
    id="prompt"
    type="text"
    placeholder="Chat is currently unavailable"
    autocomplete="off"
    aria-label="Message Rocky"
    disabled
  >
  <button id="send" type="submit" disabled>Send</button>
</form>

<footer>Rocky AI · Phase 2 · Preview Testing</footer>

</div>

<script>
const API_BASE = "https://rocky-ai-api.anowbuth.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const send = document.getElementById("send");
const status = document.getElementById("status");
const availability = document.getElementById("availability");
const welcome = document.getElementById("welcome");
const cards = document.getElementById("cards");

let chatEnabled = false;
let conversation = [];
let requestInProgress = false;

function setChatEnabled(enabled) {
  chatEnabled = enabled;

  input.disabled = !enabled;
  send.disabled = !enabled;

  document.querySelectorAll(".card").forEach(card => {
    card.disabled = !enabled;
  });

  if (enabled) {
    status.textContent = "Online";
    availability.textContent = "Rocky AI is available. You can start chatting.";
    input.placeholder = "Ask Rocky anything...";
  } else {
    status.textContent = "Preview · Testing";
    availability.textContent =
      "Rocky AI is currently in testing. Chat will become available after testing is complete.";
    input.placeholder = "Chat is currently unavailable";
  }
}

function addMessage(text, type, loading = false) {
  const div = document.createElement("div");

  div.className = "message " + type;

  if (loading) {
    div.classList.add("loading");
  }

  div.textContent = text;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });

  return div;
}

function suggest(text) {
  if (!chatEnabled || requestInProgress) return;

  input.value = text;
  document.getElementById("form").requestSubmit();
}

function newChat() {
  if (requestInProgress) return;

  conversation = [];
  chat.replaceChildren();

  welcome.style.display = "";
  cards.style.display = "";

  input.value = "";

  addMessage("New conversation ready. Chat is currently in testing mode.", "bot");

  if (chatEnabled) {
    input.focus();
  }
}

document.getElementById("newChat").addEventListener("click", newChat);

async function checkAvailability() {
  setChatEnabled(false);
  status.textContent = "Checking availability...";
  availability.textContent = "Checking Rocky AI availability...";

  try {
    const response = await fetch(API_BASE + "/api/health", {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Health check failed");
    }

    const data = await response.json();

    if (data.worker !== "online") {
      throw new Error("Worker unavailable");
    }

    setChatEnabled(data.chatEnabled === true);

  } catch {
    setChatEnabled(false);
    status.textContent = "Currently unavailable";
    availability.textContent =
      "Unable to verify Rocky AI availability. Chat remains disabled for safety.";
  }
}

document.getElementById("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  if (!chatEnabled || requestInProgress) return;

  const text = input.value.trim();

  if (!text) return;

  welcome.style.display = "none";
  cards.style.display = "none";

  conversation.push({
    role: "user",
    content: text
  });

  addMessage(text, "user");

  input.value = "";
  requestInProgress = true;
  send.disabled = true;

  const loading = addMessage(
    "Rocky is preparing a response...",
    "bot",
    true
  );

  try {
    const response = await fetch(API_BASE + "/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: conversation
      })
    });

    const data = await response.json();

    if (!response.ok) {
      conversation.pop();

      loading.textContent =
        data.error || "Rocky is temporarily unavailable.";

      return;
    }

    if (typeof data.reply !== "string" || !data.reply.trim()) {
      conversation.pop();

      loading.textContent =
        "Rocky returned an empty response. Please try again.";

      return;
    }

    loading.classList.remove("loading");
    loading.textContent = data.reply;

    conversation.push({
      role: "assistant",
      content: data.reply
    });

  } catch {
    conversation.pop();

    loading.textContent =
      "Unable to reach Rocky's backend. Please try again.";

  } finally {
    requestInProgress = false;
    send.disabled = !chatEnabled;
    input.focus();
  }
});

checkAvailability();
</script>

</body>
</html>
