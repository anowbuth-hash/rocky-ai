
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131c">
<meta name="description" content="Rocky AI — Your AI assistant for learning, creativity, problem-solving and everyday tasks.">
<title>Rocky AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10131c;
  color: #f5f6fa;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}

.logo {
  background: #7567f8;
  border-radius: 14px;
  padding: 12px;
  font-size: 22px;
  font-weight: bold;
}

h1 {
  font-size: 22px;
  margin: 0;
}

.status {
  color: #9ba3b7;
  font-size: 12px;
  margin-top: 5px;
}

.header-actions {
  margin-left: auto;
}

.new-chat {
  background: #252b3c;
  border: 1px solid #424a61;
  padding: 10px 13px;
}

main {
  flex: 1;
  padding: 25px 0;
}

.welcome {
  text-align: center;
  margin: 35px 0;
}

.welcome h2 {
  font-size: 30px;
}

.welcome p {
  color: #aab1c2;
  line-height: 1.6;
}

.availability {
  background: #252b3c;
  border: 1px solid #424a61;
  border-radius: 12px;
  padding: 14px;
  margin: 20px 0;
  text-align: center;
  color: #d8dced;
  font-size: 14px;
  line-height: 1.5;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 25px 0;
}

.card {
  background: #1b2030;
  border: 1px solid #30374a;
  border-radius: 13px;
  padding: 17px;
  color: white;
  text-align: left;
  cursor: pointer;
}

.card:hover:not(:disabled) {
  border-color: #7567f8;
}

.card strong {
  display: block;
  margin-bottom: 7px;
}

.card span {
  color: #aab1c2;
  font-size: 13px;
}

#chat {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  padding: 13px 16px;
  border-radius: 15px;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #6659df;
  align-self: flex-end;
}

.bot {
  background: #202638;
  align-self: flex-start;
}

.message.loading {
  opacity: 0.75;
  font-style: italic;
}

form {
  display: flex;
  gap: 10px;
  background: #1b2030;
  border: 1px solid #343b50;
  border-radius: 16px;
  padding: 9px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: white;
  font-size: 16px;
  padding: 8px;
}

input::placeholder {
  color: #929bb0;
}

button {
  border: 0;
  background: #7567f8;
  color: white;
  border-radius: 11px;
  padding: 12px 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled,
input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid #aaa1ff;
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
}

button:focus:not(:focus-visible),
input:focus:not(:focus-visible) {
  outline: none;
}

footer {
  text-align: center;
  color: #788197;
  font-size: 11px;
  padding: 16px;
}

@media(max-width: 420px) {
  .app {
    padding: 14px;
  }

  header {
    flex-wrap: wrap;
  }

  .welcome h2 {
    font-size: 25px;
  }

  .cards {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .card {
    padding: 14px;
  }

  .header-actions button {
    padding: 9px;
    font-size: 12px;
  }

  form {
    gap: 6px;
  }

  form button {
    padding: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
  
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo" aria-hidden="true">R</div>

  <div>
    <h1>Rocky AI</h1>
    <div class="status" id="status" aria-live="polite">
      Checking availability...
    </div>
  </div>

  <div class="header-actions">
    <button class="new-chat" id="newChat" type="button">
      + New Chat
    </button>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <h2>Welcome to Rocky AI</h2>
    <p>Your AI assistant for learning, creativity, problem-solving and everyday tasks.</p>
  </section>

  <div
    class="availability"
    id="availability"
    role="status"
    aria-live="polite"
  >
    Checking Rocky AI availability...
  </div>

  <div class="cards" id="cards">
    <button class="card" type="button" onclick="openExplore()">
      <strong>📍 Explore Nearby</strong>
      <span>Discover places within 5 km of you</span>
    </button>
    
    <button class="card chat-card" type="button" onclick="suggest('Help me plan my day')" disabled>
      <strong>📅 Plan my day</strong>
      <span>Organise tasks and goals</span>
    </button>

    <button class="card chat-card" type="button" onclick="suggest('Help me explore a business idea')" disabled>
      <strong>💡 Explore ideas</strong>
      <span>Discover new possibilities</span>
    </button>

    <button class="card chat-card" type="button" onclick="suggest('Teach me something interesting')" disabled>
      <strong>📚 Learn something</strong>
      <span>Understand new topics</span>
    </button>

    <button class="card chat-card" type="button" onclick="suggest('Help me write something')" disabled>
      <strong>✍️ Write something</strong>
      <span>Make writing easier</span>
    </button>
  </div>

  <section id="explore" style="display:none;">
  <h2>Explore Nearby</h2>
  <p>Select places you want to discover within 5 km.</p>

  <div id="exploreCategories" class="cards"></div>

  <button type="button" onclick="getNearbyPlaces()">
    Find places near me
  </button>

  <button type="button" onclick="closeExplore()">
    Back to Rocky AI
  </button>

  <div id="exploreResults"></div>
</section>
  
  <div id="chat" aria-live="polite"></div>
</main>

<form id="form">
  <input
    id="prompt"
    type="text"
    placeholder="Chat is currently unavailable"
    autocomplete="off"
    aria-label="Message Rocky"
    disabled
  >
  <button id="send" type="submit" disabled>Send</button>
</form>

<footer>Rocky AI · Your AI assistant</footer>

</div>

<script>
const API_BASE = "https://rocky-ai-api.anowbuth.workers.dev";

const explore = document.getElementById("explore");
const exploreResults = document.getElementById("exploreResults");

const nearbyCategories = [
  "Restaurants",
  "Banks",
  "Supermarkets",
  "Shopping malls",
  "Hospitals",
  "Pharmacies",
  "Petrol stations",
  "ATMs",
  "Hotels",
  "Cafés",
  "Parks"
];

let selectedCategories = [];

function openExplore() {
  welcome.style.display = "none";
  cards.style.display = "none";
  explore.style.display = "block";

  const container = document.getElementById("exploreCategories");
  container.replaceChildren();

  nearbyCategories.forEach(category => {
    const label = document.createElement("label");
    label.className = "card";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = category;
    checkbox.style.marginRight = "10px";

    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        selectedCategories.push(category);
      } else {
        selectedCategories = selectedCategories.filter(item => item !== category);
      }
    });

    label.append(checkbox, document.createTextNode(category));
    container.appendChild(label);
  });
}

function closeExplore() {
  explore.style.display = "none";
  welcome.style.display = "";
  cards.style.display = "";
}  

async function getNearbyPlaces() {
  if (selectedCategories.length === 0) {
    alert("Please select at least one category.");
    return;
  }

  if (!navigator.geolocation) {
    alert("Location is not supported by this browser.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      exploreResults.textContent =
        `Location received. Latitude: ${latitude.toFixed(4)}, Longitude: ${longitude.toFixed(4)}.`;
    },
    () => {
      alert("Please allow location access to explore nearby places.");
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 60000
    }
  );
}
  
const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const send = document.getElementById("send");
const status = document.getElementById("status");
const availability = document.getElementById("availability");
const welcome = document.getElementById("welcome");
const cards = document.getElementById("cards");

let chatEnabled = false;
let conversation = [];
let requestInProgress = false;
let failedMessage = null;

function setChatEnabled(enabled) {
  chatEnabled = enabled;

  input.disabled = !enabled;
  send.disabled = !enabled;

  document.querySelectorAll(".chat-card").forEach(card => {
    card.disabled = !enabled;
  });

  if (enabled) {
    status.textContent = "Online";
    availability.textContent = "Rocky AI is ready. Start a conversation.";
    input.placeholder = "Ask Rocky anything...";
  } else {
    status.textContent = "Currently unavailable";
    availability.textContent =
      "Rocky AI is temporarily unavailable. Please try again later.";
    input.placeholder = "Chat is currently unavailable";
  }
}

function addMessage(text, type, loading = false) {
  const div = document.createElement("div");

  div.className = "message " + type;

  if (loading) {
    div.classList.add("loading");
  }

  div.textContent = text;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });

  return div;
}

function showRetry(messageElement, text, message) {
  failedMessage = text;

  // Remove older retry messages.
  chat.querySelectorAll(".retry-button").forEach(button => {
    button.remove();
  });

  messageElement.textContent = message;

  const retryButton = document.createElement("button");
  retryButton.type = "button";
  retryButton.textContent = "Retry";
  retryButton.className = "retry-button";

  retryButton.addEventListener("click", () => {
    if (requestInProgress || !failedMessage) return;

    input.value = failedMessage;
    document.getElementById("form").requestSubmit();
  });

  messageElement.appendChild(retryButton);
}

function suggest(text) {
  if (!chatEnabled || requestInProgress) return;

  input.value = text;
  document.getElementById("form").requestSubmit();
}

function newChat() {
  if (requestInProgress) return;

  conversation = [];
  failedMessage = null;
  chat.replaceChildren();

  welcome.style.display = "";
  cards.style.display = "";

  input.value = "";

addMessage("New conversation ready. How can I help you?", "bot");

  if (chatEnabled) {
    input.focus();
  }
}

document.getElementById("newChat").addEventListener("click", newChat);

async function checkAvailability() {
  setChatEnabled(false);
  status.textContent = "Checking availability...";
  availability.textContent = "Checking Rocky AI availability...";

  try {
    const response = await fetch(API_BASE + "/api/health", {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Health check failed");
    }

    let data = {};
    
    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (data.worker !== "online") {
      throw new Error("Worker unavailable");
    }

    setChatEnabled(data.chatEnabled === true);

  } catch {
    setChatEnabled(false);
    status.textContent = "Currently unavailable";
    availability.textContent =
      "Unable to verify Rocky AI availability. Chat remains disabled for safety.";
  }
}

document.getElementById("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  if (!chatEnabled || requestInProgress) return;

  const text = input.value.trim();

  if (!text) return;

  if (failedMessage && text !== failedMessage) {
  addMessage(
    "Please retry your previous message before sending a new one.",
    "bot"
  );
  return;
}

  welcome.style.display = "none";
  cards.style.display = "none";

if (failedMessage !== text) {
  conversation.push({
    role: "user",
    content: text
  });

  addMessage(text, "user");
}

  input.value = "";
  requestInProgress = true;
  send.disabled = true;

  const loading = addMessage(
    "Rocky is preparing a response...",
    "bot",
    true
  );

  try {
    const response = await fetch(API_BASE + "/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: conversation
      })
    });

    let data = {};

    try {
      data = await response.json();
    } catch {
      throw new Error("Invalid server response");
    }


if (!response.ok) {
  showRetry(
    loading,
    text,
    data.error || "Rocky couldn't respond."
  );
  return;
}

if (typeof data.reply !== "string" || !data.reply.trim()) {
  showRetry(
    loading,
    text,
    "Rocky returned an empty response."
  );
  return;
}

loading.classList.remove("loading");
loading.textContent = data.reply;

// Remove retry buttons from previous failed attempts.
chat.querySelectorAll(".retry-button").forEach(button => {
  button.remove();
});

conversation.push({
  role: "assistant",
  content: data.reply
});

failedMessage = null;

} catch {
  showRetry(
    loading,
    text,
    "Unable to reach Rocky. Please check your connection."
  );

  } finally {
    requestInProgress = false;
    send.disabled = !chatEnabled;
    input.focus();
  }
});

checkAvailability();
</script>

</body>
</html>
